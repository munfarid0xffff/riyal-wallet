name: Build RiyalCoin Wallet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            args: ""
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "wallet/src-tauri -> target"
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - run: npm install
      - run: npm run icons
      - run: npm run tauri -- build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: riyalcoin-wallet-${{ matrix.name }}
          path: |
            wallet/src-tauri/target/release/bundle/**/*.deb
            wallet/src-tauri/target/release/bundle/**/*.rpm
            wallet/src-tauri/target/release/bundle/**/*.AppImage
            wallet/src-tauri/target/release/bundle/**/*.msi
            wallet/src-tauri/target/release/bundle/**/*-setup.exe
            wallet/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg

  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "wallet/src-tauri -> target"
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      - run: npm install
      - run: npm run icons
      - name: Init and build Android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npm run tauri -- android init
          npm run tauri -- android build --apk
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -n1)
          test -n "$APK" || { echo "unsigned APK not found"; exit 1; }
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            KS=release.jks; PASS="$KEYSTORE_PASS"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No release keystore secret: signing with a throw-away key. Updates will NOT install over earlier builds."
            keytool -genkeypair -keystore release.jks -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temp1234 -keypass temp1234 -dname "CN=RiyalCoin Wallet"
            KS=release.jks; PASS=temp1234; ALIAS=temp
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --out RiyalCoin-Wallet.apk aligned.apk
          "$BT/apksigner" verify RiyalCoin-Wallet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: riyalcoin-wallet-android
          path: wallet/RiyalCoin-Wallet.apk
