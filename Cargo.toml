[package]
name = "riyalcoin"
version = "0.1.0"
edition = "2021"
description = "RiyalCoin - decentralized SHA-256 PoW blockchain with a fixed 12,000,000 supply"

# Security-critical crypto comes from reviewed RustCrypto crates (constant-time arithmetic, RFC 6979 nonces,
# Argon2id + ChaCha20-Poly1305). Commit Cargo.lock and build with `cargo build --release --locked`.
[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true

# keep tests fast: Argon2 and field arithmetic are very slow at opt-level 0
[profile.dev.package."*"]
opt-level = 3
