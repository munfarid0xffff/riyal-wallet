[package]
name = "riyalcoin-wallet"
version = "0.1.0"
description = "RiyalCoin wallet (Android, Windows, Linux, macOS)"
edition = "2021"

[lib]
name = "riyalcoin_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
riyalcoin = { path = "../.." }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
